<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Terminal Calculator</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/calculator.css">
    <link rel="stylesheet" href="css/display.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/buttons.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="vtc-container">
        <div class="calculator">
            <div class="device-branding">
                <span class="brand-name">VTC</span>
                <span class="model-number">SERIES 200</span>
            </div>
            <div class="speaker-grill"></div>
            <div class="calculator-display">
                <div class="display-design">
                    <header>
                        <div class="header-status">
                            <div class="status-item">
                                <span class="online icon">𒊹</span>
                                <span class="text">ONLINE</span>
                            </div>
                            <div class="status-item">
                                <span class="record icon">■</span>
                                <span class="text">REC</span>
                            </div>
                        </div>
                        <div id="system-clock" class="system-clock"></div>
                    </header>
                    <div class="terminal-log">
                        <div class="history-log"></div>
                    </div>    
                    <p class="display-txt">
                        <span class="cursor">_</span>
                    </p>
                </div>
            </div>
            <div class="buttons">
                <div class="button-wrapper">
                    <div class="button-row" id="row-1">
                        <button class="number one">1</button>
                        <button class="number two">2</button>
                        <button class="number three">3</button>
                        <button class="number four">4</button>
                        <button class="number">5</button>
                        <button class="number">6</button>
                        <button class="operator">+</button>
                        <button class="operator">-</button>
                        <button class="operator">*</button>
                        <button class="operator">/</button>
                    </div>
                    <div class="button-row" id="row-2">
                        
                        <button class="number">7</button>
                        <button class="number">8</button>
                        <button class="number">9</button>
                        <button class="number zero">0</button>
                        <button class="number double zero">00</button>
                        <button class="number dot">.</button>
                        <button class="function">CLR</button>
                        <button class="function">+/-</button>
                        <button class="function">%</button>
                        <button class="equals">=</button>
                    </div>
                </div>
            </div>
            <div class="device-decoration">
                <div class="knob"></div>
                <div class="dent-container"></div>
                <div class="slider">
                    <div class="slider-track"></div>
                    <div class="slider-thumb"></div>
                </div>
            </div>
        </div>
    </main>
</body>
